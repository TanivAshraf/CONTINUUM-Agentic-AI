name: CONTINUUM Agentic AI — Scheduled Run

on:
  schedule:
    # Runs every 6 hours at minute 0
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-continuum:
    name: Execute CONTINUUM Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CONTINUUM Agentic AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GOOGLE_PHOTOS_REFRESH_TOKEN: ${{ secrets.GOOGLE_PHOTOS_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python main.py

      - name: Persist System Memory Back to Git
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add data/system_memory.json research_logs/
          git diff-index --quiet HEAD || (git commit -m "chore(memory): persist processed photo state [skip ci]" && git push)

      - name: Upload research logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-logs-${{ github.run_id }}
          path: research_logs/
          retention-days: 30
